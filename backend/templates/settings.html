{% extends "base.html" %}

    {% block 'css' %}
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #003366;
            color: white;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-name {
            margin-right: 10px;
        }

        .user-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }

        .sidebar {
            flex: 0 0 300px;
            background-color: #004080;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-right: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav ul li {
            margin: 15px 0;
        }

        .sidebar nav ul li a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-size: 1.1em;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .sidebar nav ul li a:hover, .sidebar nav ul li a.active {
            background-color: #00509E;
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .settings-container h2 {
            color: #004080;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .checkbox-label input {
            margin-right: 10px;
        }

        .language-setting {
            margin-bottom: 20px;
        }

        .language-setting label {
            display: block;
            margin-bottom: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #00509E;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #003F7F;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                margin-right: 0;
                margin-bottom: 20px;
            }
        }
    </style>
    {% endblock %}

        {% block 'main' %}
        <main class="main-content">
            <div class="settings-container">
                <h2>Настройки</h2>

                <label class="checkbox-label">
                    <input type="checkbox" id="email-notifications"> Разрешить отправление уведомлений на почту
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" id="sms-notifications"> Разрешить отправление SMS уведомлений
                </label>

                <div class="language-setting">
                    <label>Язык интерфейса:</label>
                    <select id="language-select">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="kz">Қазақша</option>
                    </select>
                </div>

                <div class="theme-setting">
                    <label>Выбор темы сайта:</label>
                    <select id="theme-select">
                        <option value="light">Светлая</option>
                        <option value="dark">Тёмная</option>
                    </select>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="data-save-mode"> Включить режим экономии данных
                </label>

                <button class="save-settings-btn">Сохранить настройки</button>
            </div>
        </main>
        {% endblock %}

    {% block 'js' %}
    <script>
        document.querySelector('.save-settings-btn').addEventListener('click', () => {
            const emailNotifications = document.getElementById('email-notifications').checked;
            const smsNotifications = document.getElementById('sms-notifications').checked;
            const selectedLanguage = document.getElementById('language-select').value;
            const selectedTheme = document.getElementById('theme-select').value;
            const dataSaveMode = document.getElementById('data-save-mode').checked;

            console.log('Настройки сохранены:');
            console.log(`Уведомления на почту: ${emailNotifications}`);
            console.log(`SMS уведомления: ${smsNotifications}`);
            console.log(`Язык: ${selectedLanguage}`);
            console.log(`Тема: ${selectedTheme}`);
            console.log(`Экономия данных: ${dataSaveMode}`);
            alert('Настройки успешно сохранены!');
        });
    </script>
    {% endblock %}
